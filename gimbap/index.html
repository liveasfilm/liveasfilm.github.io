<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>소풍 김밥 — 쌓인 재료 김밥 퍼즐</title>
<meta name="description" content="소풍 김밥은 쌓인 재료를 위에서부터 꺼내 손님 주문대로 김밥을 마는 퍼즐 게임입니다. 40 스테이지, 김밥 22종, 단면 도감. 광고와 결제가 없습니다.">
<link rel="icon" href="assets/icon.png">
<link rel="apple-touch-icon" href="assets/icon.png">
<meta property="og:type" content="website">
<meta property="og:title" content="소풍 김밥 — Picnic Gimbap puzzle">
<meta property="og:description" content="쌓인 재료를 꺼내 주문대로 김밥을 마는 퍼즐. 40 스테이지, 광고·결제 없음.">
<meta property="og:image" content="https://liveasfilm.github.io/gimbap/assets/icon.png">
<meta property="og:url" content="https://liveasfilm.github.io/gimbap/">
<meta name="twitter:card" content="summary">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fff8ee; --bg-2:#ffeeda; --panel:#ffffff; --ink:#2b2118; --muted:#7a6656;
    --line:#f0dcc4; --orange:#f07a2a; --orange-dk:#b8521a; --nori:#1f2a22; --green:#4f9d3a;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--ink);line-height:1.7;font-size:16px;overflow-x:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Segoe UI",Roboto,sans-serif;
    word-break:keep-all}
  img{max-width:100%;display:block}
  a{color:var(--orange-dk);text-decoration:none}
  a:hover{text-decoration:underline}
  .wrap{max-width:1100px;margin:0 auto;padding:0 20px}
  header{position:sticky;top:0;z-index:50;background:rgba(255,248,238,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  .bar{display:flex;align-items:center;gap:14px;height:60px}
  .brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
  .brand img{width:34px;height:34px;border-radius:9px}
  .brand b{font-family:"Jua",sans-serif;font-weight:400;font-size:21px;white-space:nowrap}
  .langs{display:flex;gap:4px}
  .langs button{appearance:none;border:1px solid transparent;background:transparent;color:var(--muted);font:inherit;font-size:13px;padding:5px 10px;border-radius:999px;cursor:pointer}
  .langs button[aria-selected="true"]{background:var(--nori);color:#fff;font-weight:700}

  .hero{background:radial-gradient(circle at 80% 30%,#ffb46b 0,#f8923f 45%,#ef7426 100%);color:#fff}
  .hero .wrap{display:grid;grid-template-columns:1.2fr 1fr;gap:40px;align-items:center;padding-top:64px;padding-bottom:64px}
  .eyebrow{display:inline-block;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.55);font-size:13px;font-weight:700;padding:4px 12px;border-radius:999px}
  h1{font-family:"Jua",sans-serif;font-weight:400;font-size:clamp(38px,5.6vw,62px);line-height:1.15;margin:18px 0 0}
  h1 em{font-style:normal;color:var(--nori)}
  .lede{font-size:17px;margin:18px 0 0;color:#fff6ec}
  .stores{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
  .store{display:inline-flex;flex-direction:column;justify-content:center;min-width:170px;padding:9px 20px;border-radius:14px;background:var(--nori);color:#fff;line-height:1.3}
  .store small{font-size:11px;opacity:.75}
  .store span{font-size:17px;font-weight:700}
  .store[aria-disabled="true"]{opacity:.8;cursor:default}
  .store:hover{text-decoration:none}
  .store-note{font-size:14px;margin-top:14px;color:#fff3e4}
  .mascot{border-radius:32px;box-shadow:0 22px 50px rgba(120,50,0,.35);width:100%;max-width:400px;justify-self:center}

  section{padding:76px 0;border-top:1px solid var(--line)}
  .kicker{color:var(--orange);font-weight:700;letter-spacing:.12em;font-size:13px;text-transform:uppercase;margin:0}
  h2{font-family:"Jua",sans-serif;font-weight:400;font-size:clamp(28px,3.8vw,40px);line-height:1.25;margin:8px 0 0}
  .feats{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin-top:36px}
  .feat{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px}
  .feat .ico{font-size:30px}
  .feat h3{font-size:20px;margin:8px 0 0}
  .feat p{color:var(--muted);margin:8px 0 0}
  .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:36px}
  .card{background:var(--nori);color:#fff;border-radius:18px;padding:20px}
  .card b{display:block;font-family:"Jua",sans-serif;font-weight:400;font-size:38px;color:#ffb46b;line-height:1.2}
  .card span{font-size:14px;color:#d8e0d4}
  .shots{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:36px}
  .shot{aspect-ratio:9/19.5;border-radius:26px;border:6px solid var(--nori);background:repeating-linear-gradient(135deg,var(--bg-2) 0 14px,#fff3e3 14px 28px);
    display:flex;align-items:center;justify-content:center;text-align:center;padding:14px;color:var(--muted);font-size:14px;overflow:hidden}
  .shot img{width:100%;height:100%;object-fit:cover}
  details{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 18px;margin-top:10px}
  summary{cursor:pointer;font-weight:700}
  details p{color:var(--muted);margin:10px 0 0}
  footer{border-top:1px solid var(--line);padding:36px 0 48px;color:var(--muted);font-size:14px}
  .foot-row{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
  .foot-links{display:flex;gap:18px}
  @media (max-width:820px){
    .hero .wrap{grid-template-columns:1fr}
    .mascot{max-width:300px}
    .feats{grid-template-columns:1fr}
    .cards,.shots{grid-template-columns:repeat(2,1fr)}
  }
</style>
</head>
<body>
<header>
  <div class="wrap bar">
    <div class="brand"><img src="assets/icon.png" alt=""><b data-i18n="brand"></b></div>
    <div class="langs" role="tablist">
      <button data-lang="ko" aria-selected="true">한국어</button>
      <button data-lang="en" aria-selected="false">EN</button>
    </div>
  </div>
</header>

<div class="hero">
  <div class="wrap">
    <div>
      <span class="eyebrow" data-i18n="hero.badge"></span>
      <h1 data-i18n="hero.h1"></h1>
      <p class="lede" data-i18n="hero.lede"></p>
      <div class="stores">
        <!-- 출시 후 href를 스토어 주소로 바꾸고 aria-disabled를 지운다 -->
        <a class="store" id="store-ios" href="#" aria-disabled="true"><small data-i18n="store.ios.s"></small><span>App Store</span></a>
        <a class="store" id="store-android" href="#" aria-disabled="true"><small data-i18n="store.and.s"></small><span>Google Play</span></a>
      </div>
      <p class="store-note" data-i18n="hero.store"></p>
    </div>
    <img class="mascot" src="assets/icon.png" alt="소풍 김밥 마스코트">
  </div>
</div>

<section id="features">
  <div class="wrap">
    <p class="kicker" data-i18n="feat.kicker"></p>
    <h2 data-i18n="feat.h2"></h2>
    <div class="feats">
      <div class="feat"><div class="ico">🥕</div><h3 data-i18n="f1.h"></h3><p data-i18n="f1.p"></p></div>
      <div class="feat"><div class="ico">🍱</div><h3 data-i18n="f2.h"></h3><p data-i18n="f2.p"></p></div>
      <div class="feat"><div class="ico">⭐</div><h3 data-i18n="f3.h"></h3><p data-i18n="f3.p"></p></div>
      <div class="feat"><div class="ico">📖</div><h3 data-i18n="f4.h"></h3><p data-i18n="f4.p"></p></div>
    </div>
  </div>
</section>

<section>
  <div class="wrap">
    <p class="kicker" data-i18n="num.kicker"></p>
    <h2 data-i18n="num.h2"></h2>
    <div class="cards">
      <div class="card"><b>40</b><span data-i18n="num.1"></span></div>
      <div class="card"><b>22</b><span data-i18n="num.2"></span></div>
      <div class="card"><b>10</b><span data-i18n="num.3"></span></div>
      <div class="card"><b>0</b><span data-i18n="num.4"></span></div>
    </div>
  </div>
</section>

<section id="shots">
  <div class="wrap">
    <p class="kicker" data-i18n="shots.kicker"></p>
    <h2 data-i18n="shots.h2"></h2>
    <!-- 스크린샷이 준비되면 각 .shot 안의 span을 <img src="assets/shot1.png" alt="">로 바꾼다 -->
    <div class="shots">
      <div class="shot"><span data-i18n="shot.1"></span></div>
      <div class="shot"><span data-i18n="shot.2"></span></div>
      <div class="shot"><span data-i18n="shot.3"></span></div>
      <div class="shot"><span data-i18n="shot.4"></span></div>
    </div>
  </div>
</section>

<section id="faq">
  <div class="wrap">
    <p class="kicker" data-i18n="faq.kicker"></p>
    <h2 data-i18n="faq.h2"></h2>
    <div style="margin-top:28px">
      <details><summary data-i18n="q1.q"></summary><p data-i18n="q1.a"></p></details>
      <details><summary data-i18n="q2.q"></summary><p data-i18n="q2.a"></p></details>
      <details><summary data-i18n="q3.q"></summary><p data-i18n="q3.a"></p></details>
      <details><summary data-i18n="q4.q"></summary><p data-i18n="q4.a"></p></details>
    </div>
  </div>
</section>

<footer>
  <div class="wrap foot-row">
    <span>© 2026 liveasfilm</span>
    <div class="foot-links">
      <a href="privacy/" data-i18n="foot.privacy"></a>
      <a href="mailto:liveasfilm@gmail.com" data-i18n="foot.contact"></a>
    </div>
  </div>
</footer>

<script>
const I18N = {
  ko:{
    "html.title":"소풍 김밥 — 쌓인 재료 김밥 퍼즐",
    "brand":"소풍 김밥",
    "hero.badge":"iOS · Android 김밥 퍼즐",
    "hero.h1":"재료를 꺼내고,<br><em>주문대로 말아라</em>",
    "hero.lede":"김 아래 숨은 재료를 하나씩 뒤집어 꺼내고, 손님 세 명의 주문대로 김밥을 말아 내보내세요. 쓸 데 없는 재료는 쟁반에 잠시 올려 둘 수 있지만, 다섯 칸이 넘치면 끝!",
    "store.ios.s":"출시 예정",
    "store.and.s":"출시 예정",
    "hero.store":"App Store · Google Play 출시 준비 중",
    "feat.kicker":"Features",
    "feat.h2":"무엇부터 꺼낼까, 그게 퍼즐",
    "f1.h":"맨 위만 보이는 재료 더미",
    "f1.p":"보드에는 맨 위 재료만 앞면으로 보이고, 그 아래는 김 뒷면에 가려 있습니다. 하나를 꺼내야 다음 재료가 드러나요.",
    "f2.h":"손님 주문, 쟁반 다섯 칸",
    "f2.p":"누른 재료는 필요한 김발로 날아갑니다. 어디에도 필요 없으면 쟁반으로. 쟁반이 넘치기 전에 주문을 모두 내보내면 성공입니다.",
    "f3.h":"40 스테이지와 별 세 개",
    "f3.p":"쟁반을 적게 쓸수록 별이 늘어납니다. 스테이지가 갈수록 메뉴와 재료가 늘고, 더미는 깊어집니다.",
    "f4.h":"특별 김밥과 단면 도감",
    "f4.p":"마약김밥, 땡초김밥, 멸추김밥, 연어김밥 같은 특별 김밥 10종을 포함해 김밥 22종. 처음 만든 김밥은 단면이 도감에 모입니다.",
    "num.kicker":"By the numbers",
    "num.h2":"짧게 한 판, 차곡차곡 도감",
    "num.1":"스테이지",
    "num.2":"김밥 종류",
    "num.3":"특별 김밥",
    "num.4":"광고와 결제",
    "shots.kicker":"Screenshots",
    "shots.h2":"오늘의 김밥집",
    "shot.1":"스테이지 지도<br>(스크린샷 준비 중)",
    "shot.2":"플레이 화면<br>(스크린샷 준비 중)",
    "shot.3":"새 단면 발견<br>(스크린샷 준비 중)",
    "shot.4":"단면 도감<br>(스크린샷 준비 중)",
    "faq.kicker":"FAQ",
    "faq.h2":"자주 묻는 질문",
    "q1.q":"무료인가요? 광고가 있나요?",
    "q1.a":"광고도, 인앱 결제도 없습니다. 끝까지 그대로 즐길 수 있어요.",
    "q2.q":"인터넷이 없어도 되나요?",
    "q2.a":"네. 게임은 인터넷 연결 없이 동작하고, 진행 기록은 기기 안에만 저장됩니다.",
    "q3.q":"어떤 기기에서 할 수 있나요?",
    "q3.a":"iPhone, iPad, Android 휴대폰과 태블릿에서 세로 화면으로 플레이합니다.",
    "q4.q":"문의는 어디로 하나요?",
    "q4.a":"liveasfilm@gmail.com 으로 보내 주세요.",
    "foot.privacy":"개인정보처리방침",
    "foot.contact":"문의"
  },
  en:{
    "html.title":"Picnic Gimbap — a stacked-ingredient kimbap puzzle",
    "brand":"Picnic Gimbap",
    "hero.badge":"Kimbap puzzle for iOS and Android",
    "hero.h1":"Dig out the fillings.<br><em>Roll every order.</em>",
    "hero.lede":"Flip the ingredients hidden under the seaweed one at a time and roll kimbap to order for three hungry customers. Park what you can't use yet on the tray, but if all five slots fill up, the day is over!",
    "store.ios.s":"Coming soon",
    "store.and.s":"Coming soon",
    "hero.store":"Coming soon to the App Store and Google Play",
    "feat.kicker":"Features",
    "feat.h2":"What to pick first? That's the puzzle.",
    "f1.h":"Only the top tile shows",
    "f1.p":"Each stack shows just its top ingredient. Everything below is face-down seaweed until you lift what's on top.",
    "f2.h":"Customer orders, a five-slot tray",
    "f2.p":"Tap an ingredient and it flies to the mat that needs it. If no mat does, it goes on the tray. Serve every order before the tray overflows.",
    "f3.h":"40 stages, three stars each",
    "f3.p":"Use fewer tray slots to earn more stars. New menus and ingredients arrive as you go, and the stacks get deeper.",
    "f4.h":"Special rolls and a cross-section collection",
    "f4.p":"22 kinds of kimbap, including 10 specials like mayak, spicy chili, anchovy and salmon kimbap. Every roll you make for the first time adds its cross-section to your collection.",
    "num.kicker":"By the numbers",
    "num.h2":"Quick rounds, a growing collection",
    "num.1":"stages",
    "num.2":"kinds of kimbap",
    "num.3":"special rolls",
    "num.4":"ads or purchases",
    "shots.kicker":"Screenshots",
    "shots.h2":"Today's kimbap shop",
    "shot.1":"Stage map<br>(screenshot coming soon)",
    "shot.2":"Gameplay<br>(screenshot coming soon)",
    "shot.3":"New cross-section<br>(screenshot coming soon)",
    "shot.4":"Collection<br>(screenshot coming soon)",
    "faq.kicker":"FAQ",
    "faq.h2":"FAQ",
    "q1.q":"Is it free? Are there ads?",
    "q1.a":"No ads and no in-app purchases. The whole game is yours to play.",
    "q2.q":"Does it need an internet connection?",
    "q2.a":"No. The game works offline and your progress is stored only on your device.",
    "q3.q":"Which devices?",
    "q3.a":"iPhone, iPad and Android phones and tablets, in portrait. The interface is currently in Korean.",
    "q4.q":"How do I contact you?",
    "q4.a":"Email liveasfilm@gmail.com.",
    "foot.privacy":"Privacy Policy",
    "foot.contact":"Contact"
  }
};
function setLang(l){
  const t = I18N[l] || I18N.ko;
  document.documentElement.lang = l;
  document.title = t["html.title"];
  document.querySelectorAll("[data-i18n]").forEach(el => { el.innerHTML = t[el.dataset.i18n] || ""; });
  document.querySelectorAll(".langs button").forEach(b => b.setAttribute("aria-selected", b.dataset.lang === l));
  try { localStorage.setItem("gimbap.lang", l); } catch (e) {}
}
document.querySelectorAll(".langs button").forEach(b => b.addEventListener("click", () => setLang(b.dataset.lang)));
document.querySelectorAll('.store[aria-disabled="true"]').forEach(a => a.addEventListener("click", e => e.preventDefault()));
let start = "ko";
try { start = localStorage.getItem("gimbap.lang") || (navigator.language || "ko").slice(0, 2); } catch (e) {}
setLang(I18N[start] ? start : "en");
</script>
</body>
</html>
