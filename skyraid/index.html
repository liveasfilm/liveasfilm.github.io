<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SKY RAID — 항공모함에서 출격하는 픽셀 공습 액션</title>
<meta name="description" content="SKY RAID는 항공모함에서 출격해 섬의 방공망을 뚫고 랜드마크를 폭격한 뒤 다시 착함하는 픽셀 아트 공습 액션 게임입니다.">
<link rel="icon" href="assets/icon.png">
<link rel="apple-touch-icon" href="assets/icon.png">
<meta property="og:type" content="website">
<meta property="og:title" content="SKY RAID — Pixel air raid action">
<meta property="og:description" content="Launch from a carrier, bomb the island, land back aboard.">
<meta property="og:image" content="https://liveasfilm.github.io/skyraid/assets/og.png">
<meta property="og:url" content="https://liveasfilm.github.io/skyraid/">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Russo+One&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0d33; --bg-2:#111648; --panel:#161c55; --ink:#eef1ff; --muted:#a9b2e0;
    --line:#2a3274; --gold:#f2c84b; --gold-dk:#6b4a00; --red:#e2483d; --sea:#123a5c;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--ink);line-height:1.7;font-size:16px;overflow-x:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Segoe UI",Roboto,sans-serif;
    word-break:keep-all}
  img{max-width:100%;display:block}
  a{color:var(--gold);text-decoration:none}
  a:hover{text-decoration:underline}
  .wrap{max-width:1100px;margin:0 auto;padding:0 20px}
  header{position:sticky;top:0;z-index:50;background:rgba(11,13,51,.88);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  .bar{display:flex;align-items:center;gap:14px;height:60px}
  .brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
  .brand img{width:34px;height:34px;border-radius:8px;image-rendering:pixelated}
  .brand b{font-family:"Russo One",sans-serif;letter-spacing:.08em;color:var(--gold);font-size:18px;white-space:nowrap}
  .langs{display:flex;gap:4px}
  .langs button{appearance:none;border:1px solid transparent;background:transparent;color:var(--muted);font:inherit;font-size:13px;padding:5px 10px;border-radius:999px;cursor:pointer}
  .langs button[aria-selected="true"]{background:var(--gold);color:#1a1400;font-weight:700}

  .hero{position:relative;overflow:hidden;
    background:repeating-linear-gradient(180deg,rgba(255,255,255,.035) 0 6px,transparent 6px 24px),
      linear-gradient(180deg,#0d0f3a 0%,#1c2a7a 55%,#2d4aa8 100%)}
  .hero .wrap{display:grid;grid-template-columns:1fr 1.15fr;gap:40px;align-items:center;padding-top:72px;padding-bottom:72px}
  .eyebrow{display:inline-block;background:rgba(242,200,75,.14);border:1px solid rgba(242,200,75,.5);color:var(--gold);font-size:13px;font-weight:700;padding:4px 12px;border-radius:999px}
  h1{font-family:"Black Han Sans","Russo One",sans-serif;font-weight:400;font-size:clamp(36px,5.4vw,60px);line-height:1.15;margin:18px 0 0}
  h1 em{font-style:normal;color:var(--gold)}
  .lede{color:#cfd8ff;font-size:17px;margin:18px 0 0}
  .cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:12px 22px;border-radius:999px;font-weight:700}
  .btn-primary{background:var(--gold);color:#1a1400;box-shadow:0 4px 0 var(--gold-dk)}
  .btn-ghost{border:1px solid rgba(255,255,255,.4);color:#fff}
  .btn:hover{text-decoration:none;filter:brightness(1.06)}
  .store-note{color:var(--muted);font-size:14px;margin-top:14px}
  .screen{border:5px solid var(--gold);border-radius:18px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.5);background:#000}
  .screen img{width:100%;image-rendering:pixelated}

  section{padding:80px 0;border-top:1px solid var(--line)}
  .kicker{color:var(--gold);font-weight:700;letter-spacing:.12em;font-size:13px;text-transform:uppercase;margin:0}
  h2{font-family:"Black Han Sans","Russo One",sans-serif;font-weight:400;font-size:clamp(28px,3.6vw,40px);line-height:1.25;margin:8px 0 0}
  .feature{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center;margin-top:56px}
  .feature:nth-child(even) .screen{order:2}
  .feature h3{font-size:24px;margin:0}
  .feature p{color:var(--muted);margin:10px 0 0}
  .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:36px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px}
  .card b{display:block;font-family:"Russo One",sans-serif;font-size:30px;color:var(--gold)}
  .card span{color:var(--muted);font-size:14px}
  .shots{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:36px}
  .shots img{border-radius:10px;border:2px solid var(--line);image-rendering:pixelated}
  details{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin-top:10px}
  summary{cursor:pointer;font-weight:700}
  details p{color:var(--muted);margin:10px 0 0}
  footer{border-top:1px solid var(--line);padding:36px 0 48px;color:var(--muted);font-size:14px}
  .foot-row{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
  .foot-links{display:flex;gap:18px}
  @media (max-width:820px){
    .hero .wrap,.feature{grid-template-columns:1fr}
    .feature:nth-child(even) .screen{order:0}
    .cards{grid-template-columns:repeat(2,1fr)}
    .shots{grid-template-columns:1fr 1fr}
  }
</style>
</head>
<body>
<header>
  <div class="wrap bar">
    <div class="brand"><img src="assets/icon.png" alt=""><b>SKY RAID</b></div>
    <div class="langs" role="tablist">
      <button data-lang="ko" aria-selected="true">한국어</button>
      <button data-lang="en" aria-selected="false">EN</button>
    </div>
  </div>
</header>

<div class="hero">
  <div class="wrap">
    <div>
      <span class="eyebrow" data-i18n="hero.badge"></span>
      <h1 data-i18n="hero.h1"></h1>
      <p class="lede" data-i18n="hero.lede"></p>
      <div class="cta">
        <a class="btn btn-primary" href="#features" data-i18n="hero.cta1"></a>
        <a class="btn btn-ghost" href="#shots" data-i18n="hero.cta2"></a>
      </div>
      <p class="store-note" data-i18n="hero.store"></p>
    </div>
    <div class="screen"><img src="assets/turn.jpg" alt="SKY RAID gameplay"></div>
  </div>
</div>

<section id="features">
  <div class="wrap">
    <p class="kicker" data-i18n="feat.kicker"></p>
    <h2 data-i18n="feat.h2"></h2>
    <div>
      <div class="feature">
        <div class="screen"><img src="assets/turn.jpg" alt=""></div>
        <div><h3 data-i18n="f1.h"></h3><p data-i18n="f1.p"></p></div>
      </div>
      <div class="feature">
        <div class="screen"><img src="assets/boom.jpg" alt=""></div>
        <div><h3 data-i18n="f2.h"></h3><p data-i18n="f2.p"></p></div>
      </div>
      <div class="feature">
        <div class="screen"><img src="assets/takeoff.jpg" alt=""></div>
        <div><h3 data-i18n="f3.h"></h3><p data-i18n="f3.p"></p></div>
      </div>
      <div class="feature">
        <div class="screen"><img src="assets/hangar.jpg" alt=""></div>
        <div><h3 data-i18n="f4.h"></h3><p data-i18n="f4.p"></p></div>
      </div>
    </div>
  </div>
</section>

<section>
  <div class="wrap">
    <p class="kicker" data-i18n="num.kicker"></p>
    <h2 data-i18n="num.h2"></h2>
    <div class="cards">
      <div class="card"><b>30</b><span data-i18n="num.1"></span></div>
      <div class="card"><b>5</b><span data-i18n="num.2"></span></div>
      <div class="card"><b>4</b><span data-i18n="num.3"></span></div>
      <div class="card"><b>17</b><span data-i18n="num.4"></span></div>
    </div>
  </div>
</section>

<section id="shots">
  <div class="wrap">
    <p class="kicker" data-i18n="shots.kicker"></p>
    <h2 data-i18n="shots.h2"></h2>
    <div class="shots">
      <img src="assets/flak.jpg" alt=""><img src="assets/night.jpg" alt=""><img src="assets/boom.jpg" alt="">
      <img src="assets/takeoff.jpg" alt=""><img src="assets/turn.jpg" alt=""><img src="assets/hangar.jpg" alt="">
    </div>
  </div>
</section>

<section>
  <div class="wrap">
    <p class="kicker" data-i18n="faq.kicker"></p>
    <h2 data-i18n="faq.h2"></h2>
    <div style="margin-top:24px">
      <details open><summary data-i18n="q1.q"></summary><p data-i18n="q1.a"></p></details>
      <details><summary data-i18n="q2.q"></summary><p data-i18n="q2.a"></p></details>
      <details><summary data-i18n="q3.q"></summary><p data-i18n="q3.a"></p></details>
      <details><summary data-i18n="q4.q"></summary><p data-i18n="q4.a"></p></details>
    </div>
  </div>
</section>

<footer>
  <div class="wrap foot-row">
    <span>© 2026 liveasfilm</span>
    <div class="foot-links">
      <a href="privacy/" data-i18n="foot.privacy"></a>
      <a href="mailto:liveasfilm@gmail.com" data-i18n="foot.contact"></a>
    </div>
  </div>
</footer>

<script>
const I18N = {
  ko:{
    "html.title":"SKY RAID — 항공모함에서 출격하는 픽셀 공습 액션",
    "hero.badge":"iOS · Android 픽셀 공습 액션",
    "hero.h1":"출격하고, 폭격하고,<br><em>다시 착함하라</em>",
    "hero.lede":"SKY RAID는 항공모함에서 출격해 섬 기지를 폭격하고, 내 섬은 실시간으로 지키는 픽셀 아트 횡스크롤 공습 액션 게임입니다. 조종간 하나로 항공모함에서 이륙해 섬의 방공망을 뚫고, 랜드마크를 무너뜨린 뒤 갑판으로 돌아오세요.",
    "hero.cta1":"게임 소개",
    "hero.cta2":"스크린샷",
    "hero.store":"App Store · Google Play 출시 준비 중",
    "feat.kicker":"Features",
    "feat.h2":"조종간 하나로 하늘을 지배하라",
    "f1.h":"옆으로 눕는 선회",
    "f1.p":"조종간을 진행 반대쪽으로 당기면 기체가 옆으로 누워 배를 보이며 돌아갑니다. 선회 중엔 고도가 떨어지니 함께 당겨 고도를 지키세요.",
    "f2.h":"폭탄 한 발에 섬이 불타오른다",
    "f2.p":"폭탄, 로켓, 어뢰, 기총으로 대공포와 벙커, 연료고, 초계정을 노리세요. 연료고를 터뜨리면 주변까지 연쇄 폭발합니다.",
    "f3.h":"항공모함에서 출격하고 착함하라",
    "f3.p":"탄을 다 쓰면 항모로 돌아와 바퀴를 내리고 와이어를 걸어 재무장과 수리를 받습니다. 착함 보조도 켤 수 있어요.",
    "f4.h":"다섯 기종, 연구와 개조",
    "f4.p":"복엽기부터 급강하폭격기, 뇌격기, 중폭격기까지. 연구소에서 무장을 강화하고 격납고에서 기체를 개조하세요. 내 섬에 방공망을 세우고 다른 플레이어를 습격할 수도 있습니다.",
    "num.kicker":"By the numbers",
    "num.h2":"한 판은 짧게, 성장은 길게",
    "num.1":"캠페인 섬",
    "num.2":"기종",
    "num.3":"기술 시대",
    "num.4":"세계의 랜드마크",
    "shots.kicker":"Screenshots",
    "shots.h2":"낮과 밤, 섬 위의 공습",
    "faq.kicker":"FAQ",
    "faq.h2":"자주 묻는 질문",
    "q1.q":"무료인가요?",
    "q1.a":"무료로 플레이할 수 있습니다. 선택형 보상 광고와 인앱 구매(금괴, 시즌 패스)가 있지만 시간과 편의만 줄여 줄 뿐, 성능은 판매하지 않습니다.",
    "q2.q":"인터넷이 없어도 되나요?",
    "q2.a":"캠페인은 오프라인으로 즐길 수 있습니다. 다른 플레이어 습격, 실시간 방어전, 인앱 구매는 인터넷 연결이 필요합니다.",
    "q3.q":"어떤 기기에서 할 수 있나요?",
    "q3.a":"iPhone, iPad, Android 휴대폰과 태블릿에서 가로 화면으로 플레이합니다.",
    "q4.q":"문의는 어디로 하나요?",
    "q4.a":"liveasfilm@gmail.com 으로 보내 주세요. 계정과 데이터 삭제 요청도 이 주소로 받습니다.",
    "foot.privacy":"개인정보처리방침",
    "foot.contact":"문의"
  },
  en:{
    "html.title":"SKY RAID — Pixel air raid action from the carrier deck",
    "hero.badge":"Pixel air raid action for iOS and Android",
    "hero.h1":"Take off. Bomb.<br><em>Land back aboard.</em>",
    "hero.lede":"SKY RAID is a side-scrolling pixel art air raid game: launch from your carrier, bomb island bases and defend your own island live. Launch from a carrier with one stick, punch through the island's flak, bring down the landmark and fly home to the deck.",
    "hero.cta1":"Features",
    "hero.cta2":"Screenshots",
    "hero.store":"Coming soon to the App Store and Google Play",
    "feat.kicker":"Features",
    "feat.h2":"One stick. The whole sky.",
    "f1.h":"Roll into the turn",
    "f1.p":"Pull the stick against your heading and the plane rolls onto its side, belly showing, as it comes round. You lose height in the turn, so pull up through it.",
    "f2.h":"One bomb. The island burns.",
    "f2.p":"Bombs, rockets, torpedoes and guns against flak, bunkers, fuel depots and patrol boats. Blow a fuel depot and the blast chains to everything nearby.",
    "f3.h":"Launch from the carrier. Land back aboard.",
    "f3.p":"Out of ammo? Fly home, drop the gear, catch the wire and rearm. A landing assist is there if you want it.",
    "f4.h":"Five aircraft. Endless upgrades.",
    "f4.p":"From the biplane to dive bombers, torpedo bombers and the heavy bomber. Research weapons, modify airframes, build your own island defenses and raid other players.",
    "num.kicker":"By the numbers",
    "num.h2":"Short raids, long progression",
    "num.1":"campaign islands",
    "num.2":"aircraft",
    "num.3":"tech eras",
    "num.4":"world landmarks",
    "shots.kicker":"Screenshots",
    "shots.h2":"Day and night over the island",
    "faq.kicker":"FAQ",
    "faq.h2":"FAQ",
    "q1.q":"Is it free?",
    "q1.a":"Yes, it is free to play. There are optional rewarded ads and in-app purchases (gold, season pass), but they only save time. Performance is never for sale.",
    "q2.q":"Does it need an internet connection?",
    "q2.a":"The campaign plays offline. Raiding other players, live defense and purchases need a connection.",
    "q3.q":"Which devices?",
    "q3.a":"iPhone, iPad and Android phones and tablets, in landscape. The interface is currently in Korean.",
    "q4.q":"How do I contact you?",
    "q4.a":"Email liveasfilm@gmail.com. Account and data deletion requests go to the same address.",
    "foot.privacy":"Privacy Policy",
    "foot.contact":"Contact"
  }
};
function setLang(l){
  const t = I18N[l] || I18N.ko;
  document.documentElement.lang = l;
  document.title = t["html.title"];
  document.querySelectorAll("[data-i18n]").forEach(el => { el.innerHTML = t[el.dataset.i18n] || ""; });
  document.querySelectorAll(".langs button").forEach(b => b.setAttribute("aria-selected", b.dataset.lang === l));
  try { localStorage.setItem("skyraid.lang", l); } catch (e) {}
}
document.querySelectorAll(".langs button").forEach(b => b.addEventListener("click", () => setLang(b.dataset.lang)));
let start = "ko";
try { start = localStorage.getItem("skyraid.lang") || (navigator.language || "ko").slice(0, 2); } catch (e) {}
setLang(I18N[start] ? start : "en");
</script>
</body>
</html>
