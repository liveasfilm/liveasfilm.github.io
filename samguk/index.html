<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>삼국.io — 장수 한 명으로 시작해 천하를 통일한다</title>
<meta name="description" content="삼국.io(samguk.io)는 3분이면 한 판이 끝나는 오프라인 싱글 플레이 전쟁 게임. 병사를 흡수하고, 성문을 열고, 58개 영역을 내 색으로 물들이세요.">
<link rel="icon" href="assets/icon.png">
<meta property="og:type" content="website">
<meta property="og:title" content="삼국.io — 장수 한 명으로 시작해 천하를 통일한다">
<meta property="og:description" content="3분이면 한 판이 끝나는 오프라인 삼국지 서바이벌. 격파하면 귀순하고, 3분에 성문이 열린다.">
<meta property="og:image" content="https://liveasfilm.github.io/samguk/assets/icon.png">
<meta property="og:url" content="https://liveasfilm.github.io/samguk/">
<meta name="twitter:card" content="summary_large_image">
<style>
  :root{
    --bg:#0e0d11;
    --bg-2:#141319;
    --panel:#191820;
    --ink:#ece7dc;
    --muted:#9a9287;
    --line:#2a2831;
    --seal:#b23b2e;
    --seal-hi:#d24b3a;
    --gold:#d9a441;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Segoe UI",Roboto,sans-serif;
    line-height:1.7;font-size:16px;overflow-x:hidden;
  }
  img{max-width:100%;display:block}
  a{color:var(--gold);text-decoration:none}
  a:hover{text-decoration:underline}
  .wrap{max-width:1080px;margin:0 auto;padding:0 22px}

  /* ---------- top bar ---------- */
  header{
    position:sticky;top:0;z-index:50;background:rgba(14,13,17,.86);
    backdrop-filter:saturate(140%) blur(12px);border-bottom:1px solid var(--line);
  }
  .bar{display:flex;align-items:center;gap:16px;height:60px}
  .brand{display:flex;align-items:center;gap:10px;flex:1 1 auto;min-width:0}
  .seal{
    width:34px;height:34px;flex:0 0 auto;border:2px solid var(--seal);border-radius:5px;
    display:flex;align-items:center;justify-content:center;color:var(--seal);
    font-size:13px;font-weight:800;letter-spacing:-1px;background:rgba(178,59,46,.12);
  }
  .brand b{font-size:17px;letter-spacing:-.02em;white-space:nowrap}
  .langs{display:flex;gap:4px}
  .langs button{
    appearance:none;border:1px solid transparent;background:transparent;color:var(--muted);
    font-family:inherit;font-size:13px;padding:5px 9px;border-radius:999px;cursor:pointer;transition:.15s;
  }
  .langs button:hover{color:var(--ink)}
  .langs button[aria-selected="true"]{background:var(--seal);color:#fff}

  /* ---------- hero ---------- */
  .hero{position:relative;padding:76px 0 64px;overflow:hidden}
  .hero::before{
    content:"";position:absolute;inset:-30% -20% auto -20%;height:620px;
    background:radial-gradient(60% 60% at 50% 40%, rgba(178,59,46,.22), transparent 70%);
    pointer-events:none;
  }
  .hero-grid{position:relative;display:grid;grid-template-columns:1.15fr .85fr;gap:48px;align-items:center}
  .eyebrow{
    display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--gold);
    border:1px solid rgba(217,164,65,.35);background:rgba(217,164,65,.08);
    padding:5px 12px;border-radius:999px;margin-bottom:22px;
  }
  .wordmark{width:min(340px,72%);margin-bottom:24px;opacity:.96}
  h1{font-size:clamp(30px,4.4vw,46px);line-height:1.25;margin:0 0 18px;font-weight:800;letter-spacing:-.03em}
  .lede{font-size:17px;color:#c9c2b6;margin:0 0 28px;max-width:34em}
  .cta-row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
  .btn{
    display:inline-flex;align-items:center;gap:9px;padding:13px 22px;border-radius:10px;
    font-weight:700;font-size:15px;border:1px solid var(--line);color:var(--ink);
  }
  .btn:hover{text-decoration:none}
  .btn-primary{background:var(--seal);border-color:var(--seal);color:#fff}
  .btn-primary:hover{background:var(--seal-hi)}
  .btn-ghost:hover{border-color:#454250}
  .store-note{font-size:13px;color:var(--muted);margin:14px 0 0}

  /* ---------- phone frame ---------- */
  .phone{
    position:relative;width:min(300px,86%);margin:0 auto;border-radius:38px;padding:10px;
    background:linear-gradient(160deg,#33313c,#17161c);
    box-shadow:0 30px 70px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.05);
  }
  .phone img{border-radius:29px;width:100%;background:#000}
  .phone.empty::after{
    content:attr(data-empty);display:flex;align-items:center;justify-content:center;
    aspect-ratio:9/19.5;border-radius:29px;background:var(--panel);color:var(--muted);font-size:13px;
  }

  /* ---------- sections ---------- */
  section{padding:72px 0;border-top:1px solid var(--line)}
  .kicker{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--seal-hi);margin:0 0 12px;font-weight:700}
  h2{font-size:clamp(23px,3vw,32px);line-height:1.3;margin:0 0 16px;font-weight:800;letter-spacing:-.02em}
  h3{font-size:19px;margin:0 0 8px;font-weight:700;letter-spacing:-.01em}
  p{margin:0 0 14px}
  .muted{color:var(--muted)}

  .feature{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center;margin-bottom:88px}
  .feature:last-child{margin-bottom:0}
  .feature.rev .copy{order:2}
  .feature .lede{font-size:16.5px}

  .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px}
  .card .num{color:var(--seal-hi);font-size:13px;font-weight:800;letter-spacing:.1em;margin-bottom:10px}
  .card p{margin:0;font-size:15px;color:#bdb6aa}

  /* ---------- shots strip ---------- */
  .shots{display:flex;gap:18px;overflow-x:auto;padding:6px 22px 24px;scroll-snap-type:x mandatory}
  .shots::-webkit-scrollbar{height:8px}
  .shots::-webkit-scrollbar-thumb{background:#2f2d38;border-radius:99px}
  .shot{flex:0 0 auto;width:216px;scroll-snap-align:center}
  .shot .phone{width:100%}
  .shot .cap{font-size:13px;color:var(--muted);text-align:center;margin-top:12px}

  /* ---------- generals ---------- */
  .generals{display:flex;gap:14px;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
  .track{display:flex;gap:14px;animation:slide 42s linear infinite}
  @keyframes slide{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  .gen{flex:0 0 auto;width:124px;border-radius:12px;overflow:hidden;background:var(--panel);border:1px solid var(--line)}
  @media (prefers-reduced-motion:reduce){.track{animation:none}}

  /* ---------- offline block ---------- */
  .trust{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:32px}
  .trust div{
    background:linear-gradient(180deg,rgba(178,59,46,.10),transparent);
    border:1px solid var(--line);border-radius:12px;padding:20px 18px;text-align:center;
  }
  .trust b{display:block;font-size:26px;font-weight:800;color:var(--ink);letter-spacing:-.02em}
  .trust span{font-size:13.5px;color:var(--muted)}

  /* ---------- faq / footer ---------- */
  details{border-bottom:1px solid var(--line);padding:16px 0}
  summary{cursor:pointer;font-weight:700;list-style:none}
  summary::-webkit-details-marker{display:none}
  summary::after{content:"+";float:right;color:var(--seal-hi);font-weight:800}
  details[open] summary::after{content:"–"}
  details p{margin:12px 0 0;color:#bdb6aa;font-size:15px}

  footer{padding:44px 0 64px;border-top:1px solid var(--line);color:var(--muted);font-size:14px}
  .foot-row{display:flex;flex-wrap:wrap;gap:18px;align-items:center;justify-content:space-between}
  .foot-links{display:flex;gap:18px;flex-wrap:wrap}
  .disclaimer{margin-top:22px;font-size:12.5px;line-height:1.7;color:#6f6a63}

  @media (max-width:860px){
    .hero{padding:52px 0 44px}
    .hero-grid{grid-template-columns:1fr;gap:38px}
    .wordmark{width:250px}
    .feature{grid-template-columns:1fr;gap:28px;margin-bottom:60px}
    .feature.rev .copy{order:0}
    .cards{grid-template-columns:1fr}
    .trust{grid-template-columns:repeat(2,1fr)}
    section{padding:56px 0}
    .phone{width:min(260px,78%)}
  }
</style>
</head>
<body>

<header>

    <div class="brand">

<!-- ============ HERO ============ -->

      </div>
      <div class="phone"><img src="assets/shots/04_duel.webp" alt="" onerror="this.remove()"></div>

        <h3 data-i18n="f4.h"></h3>

      <div class="phone"><img src="assets/shots/05_map.webp" alt="" onerror="this.remove()"></div>

<!-- ============ CARDS ============ -->
<section>

<!-- ============ GENERALS ============ -->

<!-- ============ SHOTS ============ -->
<section id="shots">

<!-- ============ OFFLINE ============ -->

const GENERALS = ["liubei","guanyu","zhangfei","zhaoyun","zhugeliang","caocao","xiahoudun","simayi","sunce","zhouyu","huangzhong","lubu"];

function buildGenerals(){
  const track = document.getElementById('genTrack');
  const html = GENERALS.map(g => `<img class="gen" src="assets/portraits/${g}.webp" alt="" loading="lazy" onerror="this.remove()">`).join('');
  track.innerHTML = html + html; // duplicated for seamless loop
}

function buildShots(lang){
  const strip = document.getElementById('shotStrip');
  strip.innerHTML = SHOTS.map(s => `
    <figure class="shot" style="margin:0">
      <div class="phone"><img src="assets/shots/${s.file}" alt="${s[lang]}" loading="lazy"></div>
      <figcaption class="cap">${s[lang]}</figcaption>
    </figure>`).join('');
  strip.querySelectorAll('img').forEach(img => {
    img.onerror = () => img.closest('.shot').remove();
  });
}

function apply(lang){
  const dict = I18N[lang];
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const v = dict[el.dataset.i18n];
    if (v !== undefined) el.innerHTML = v;
  });
  document.title = dict['html.title'];
  document.documentElement.lang = lang === 'zh' ? 'zh-Hant' : lang;
  document.querySelectorAll('.langs button').forEach(b =>
    b.setAttribute('aria-selected', String(b.dataset.lang === lang)));
  buildShots(lang);
  history.replaceState(null, '', '#' + lang);
}

document.querySelectorAll('.langs button').forEach(b =>
  b.addEventListener('click', () => apply(b.dataset.lang)));

buildGenerals();
const hash = location.hash.replace('#','');
if (I18N[hash]) {
  apply(hash);
} else {
  const n = (navigator.language || 'ko').toLowerCase();
  apply(n.startsWith('ja') ? 'ja' : n.startsWith('zh') ? 'zh' : n.startsWith('en') ? 'en' : 'ko');
}
